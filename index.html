<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BlackJack</title>

        <!-- BOOTSTRAP LINK -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
            crossorigin="anonymous">

        <!-- CSS LINK -->
        <link rel="stylesheet" href="assets/css/styles.css">

        <!-- FAVICON -->
        <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon.png">

        <!-- JAVASCRIPT LINK -->
        <script defer src="assets/js/script.js"></script>
    </head>


    <body>

        <!-- HEADER -->
        <header class="py-4" role="banner">
            <div class="d-flex align-items-center justify-content-center position-relative">

                <!-- ICON LEFT -->
                <i class="fa-sharp fa-solid fa-circle-info fs-1 icon-modal" role="button" data-bs-toggle="modal" data-bs-target="#rulesmodal" aria-label="Open rules modal"></i>

                <!-- TITLE CENTER -->
                <h1 class="m-0 text-center">BlackJack</h1>

            </div>
        </header>



        <!-- MAIN SECTION: GAME AREA-->
        <main id="game" class="container pb-4" role="main">
            <div class="row g-4">

                <!-- DEALER PANEL -->
                <section class="col-12" aria-labelledby="dealer-heading">
                    <div id="dealer-heading">
                        <h2>Dealer <span id="dealer-sum" class="fw-bold text-success" aria-live="polite"></span></h2>
                    </div>

                    <div id="dealer-cards" class="d-flex flex-wrap gap-2 justify-content-center" aria-label="Dealer cards">
                        <img id="hidden" src="assets/cards/BACK.png" alt="Face-down card">
                    </div>
                </section>


                <!-- PLAYER PANNEL -->
                <section class="col-12" aria-labelledby="player-heading">
                    <div id="player-heading">
                        <h2>Player <span id="your-sum" class="fw-bold text-success" aria-live="polite"></span></h2>
                    </div>

                    <div id="your-cards" class="d-flex flex-wrap gap-2 justify-content-center" aria-label="Player cards">
                        <p>player cards go here</p>
                    </div>

                </section>

                <!-- GAME BUTTONS AND TALLY -->
                <section class="col-12" aria-label="Controls and game status">
                    <div class="card bg-gradient-dark shadow rounded-4 p-3 text-center">
                        <!-- Game buttoms -->
                        <div>
                            <button id="hit">Hit</button>
                            <button id="stay">Stay</button>
                            <button id="reset">Reset</button>
                            <button id="resetScore">Reset Score</button>
                        </div>

                        <!-- Tally -->
                        <p id="results" class="fs-5 min-h-1" aria-live="assertive" role="status"></p>

                        <p id="tally" class="text-secondary m-0" aria-live="polite">
                            Wins: <span id="wins">0</span> •
                            Losses: <span id="losses">0</span> •
                            Ties: <span id="ties">0</span>
                        </p>

                    </div>
                </section>

            </div>
        </main>
        <!-- round outcome -->

        <!-- RULES MODAL -->
        <div class="modal fade" id="rulesmodal" tabindex="-1" aria-labelledby="rulesModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="rulesModalLabel">BlackJack Rules</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>
                            Add rules here
                        </p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary modalbtncustom" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>


        <!-- FOOTER -->
        <footer class="text-center text-secondary pb-4" role="contentinfo">Footer Content</footer>

        <!-- FONT AWESOME LINK-->
        <script src="https://kit.fontawesome.com/f082230656.js" crossorigin="anonymous"></script>

        <!-- BOOTSTRAP JS LINK -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
            crossorigin="anonymous"></script>
    </body>

</html>
